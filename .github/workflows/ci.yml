name: CI

on:
  push:
    branches:
      - master
      - 10_CI_CD_Pipeline

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install API dependencies
        run: |
          pip install -r requirements_api.txt
          pip install pytest requests httpx

      - name: Install DVC
        run: pip install "dvc[s3]"

      # AWS authentivation before dvc pull
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}   
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ca-central-1

      - name: Pull DVC artifacts
        run: dvc pull

      - name: Check Python syntax
        run: |
          python -m compileall api
          python -m compileall frontend

      - name: Run health test
        run: |
          python -m pytest tests/test_health.py -v

      - name: Login to Amazon ECR
        if: github.event_name== 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker images
        if: github.event_name== 'push'
        run: docker compose build

      - name: Tag Docker images
        if: github.event_name=='push'
        run: |
          docker tag financial_sentiments-api:latest ${{steps.login-ecr.outputs.registry}}/financial-sentiment-api:latest
          docker tag financial_sentiments-streamlit:latest ${{steps.login-ecr.outputs.registry}}/financial-sentiment-streamlit:latest

      - name: Push Docker images to ECR
        if: github.event_name=='push'
        run: |
          docker push ${{steps.login-ecr.outputs.registry}}/financial-sentiment-api:latest       
          docker push ${{steps.login-ecr.outputs.registry}}/financial-sentiment-streamlit:latest       


                