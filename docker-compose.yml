services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: financial_sentiment_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    
    
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    env_file:
      - .env
    environment:
      api_url: http://api:8000/predict
    container_name: financial_sentiment_streamlit
    ports:
      - "8501:8501"      
    depends_on:
      - api
      
    