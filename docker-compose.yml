services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: financial_sentiment_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      mlflow_tracking_uri: http://host.docker.internal:5000

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: financial_sentiment_streamlit
    ports:
      - "8501:8501"      
    depends_on:
      - api
      
    