services:
  api:
    image: financial_sentiment_api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: financial_sentiment_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      llm_model_name: /app/models/smollm2
      mlflow_tracking_uri: http://host.docker.internal:5000
    
    
  streamlit:
    image: financial_sentiment_streamlit:latest
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    env_file:
      - .env
    environment:
      api_url: http://api:8000/predict
    container_name: financial_sentiment_streamlit
    ports:
      - "8501:8501"      
    depends_on:
      - api
      
    