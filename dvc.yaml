stages:
  preprocess:
    cmd: python -m src.preprocess
    deps:
      - src/preprocess.py
      - src/config.py
      - data/sent_train.csv
      - data/sent_valid.csv
    outs:
      - outputs/cleaned_data
      - outputs/cleaned_split_data

  train:
    cmd: python -m src.train_pipeline
    deps:
      - src/config.py
      - src/train_pipeline.py
      - src/train.py
      - outputs/cleaned_split_data
    outs:
      - outputs/encoders
      - outputs/nlp_classification_model/model